[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dzdoc"
version = "0.1.0"
description = "Independent Arabic-French document intelligence engine foundation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "MERATI Ali Ouala Eddine" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "numpy>=2,<3",
  "pillow>=10,<13",
  "psutil>=7,<8",
  "pyright>=1.1.408,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
pdf = ["pypdfium2>=5.5,<6"]
ocr-paddle = [
    "numpy>=2,<3",
    "paddleocr>=3.4.1,<3.5",
    "paddlepaddle>=3.3.1,<3.4",
    "pillow>=10,<13",
    "psutil>=7,<8",
    "huggingface-hub>=0.30,<1",
]

[project.scripts]
dzdoc = "dzdoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dzdoc"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
