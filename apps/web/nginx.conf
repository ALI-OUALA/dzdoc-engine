server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' http://api:8000; img-src 'self' data: blob:; frame-ancestors 'none'" always;
  location / { try_files $uri /index.html; }
}
